<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WIMS — Operate</title>
<link rel="stylesheet" href="/wims.css">
</head>
<body>
<header>
  <h1>WIMS</h1>
  <nav>
    <a href="/" class="active">Operate</a>
    <a href="/status">Status</a>
    <a href="/setup">Setup</a>
  </nav>
  <span id="conn" class="down">connecting…</span>
  <span class="meta" id="clock" style="margin-left:auto"></span>
</header>
<main>
  <div id="tx-strip" class="txbar">
    <span id="tx-status" class="banner ok">Click a roster line to work · CQ in WSJT-X</span>
    <button id="tx-halt" class="txbtn halt">◼ Halt TX</button>
    <span class="meta" id="tx-meta"></span>
  </div>

  <h2>Interlock · TX overlap</h2>
  <div id="il-banner" class="banner ok">✓ no overlap</div>
  <div id="il-meta" class="meta" style="margin:6px 0 8px"></div>
  <table id="il">
    <thead><tr>
      <th>Group</th><th>Instances</th><th>Transmitting</th><th>Status</th>
    </tr></thead>
    <tbody id="il-body"></tbody>
  </table>
  <div id="il-empty" class="empty">no instances — all RX</div>

  <h2>Call roster · stations heard</h2>
  <div id="ros-controls" class="controls">
    <label><input type="checkbox" id="ros-needed" checked> needed only</label>
    <label>band <select id="ros-band"><option value="all">all</option></select></label>
    <span class="meta" id="ros-meta"></span>
  </div>
  <table id="ros">
    <thead><tr id="ros-head"></tr></thead>
    <tbody id="ros-body"></tbody>
  </table>
  <div id="ros-empty" class="empty">no decodes yet…</div>
</main>
<script src="/wims.js"></script>
</body>
</html>
